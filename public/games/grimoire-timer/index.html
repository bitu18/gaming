<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#ffffff;
    --card-bg-1:#fbfaff;
    --card-bg-2:#ece6fb;
    --card-border:rgba(124,58,237,.16);
    --ink:#0b0a3d;
    --accent:#5b3fe0;
    --accent-deep:#492ee2;
    --btn-top:#7c64ee;
    --btn-mid:#6e54e2;
    --btn-bottom:#4d37d0;
    --pink:#e8749a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--page);
    font-family:'Nunito',system-ui,sans-serif;
    padding:40px 24px;
    color:var(--ink);
  }

  .scene{
    position:relative;
    width:100%;
    max-width:1040px;
    padding:0 60px 30px;
  }

  /* ---------------- card ---------------- */
  .card{
    position:relative;
    background:linear-gradient(135deg, var(--card-bg-1) 0%, var(--card-bg-2) 100%);
    border:1.5px solid var(--card-border);
    border-radius:32px;
    box-shadow:0 24px 60px rgba(91,63,224,0.16);
    padding:32px 44px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    overflow:hidden;
  }

  .sparkles{ position:absolute; inset:0; z-index:0; pointer-events:none; }
  .sparkles svg{ position:absolute; }

  .topbar, .stage{ position:relative; z-index:1; width:100%; }

  /* ---------------- topbar ---------------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar-left{ display:flex; align-items:center; gap:22px; }
  .logo-link{ display:block; flex:none; transition:transform .12s, filter .15s; }
  .logo-link img{ display:block; height:34px; width:auto; }
  .logo-link:hover{ transform:scale(1.05); filter:brightness(1.08); }
  .logo-link:active{ transform:scale(.95); }

  .mode-toggle{ display:flex; align-items:center; gap:10px; }

  .mode-btn{
    border:none; background:transparent; cursor:pointer;
    padding:0; display:block; filter:grayscale(65%) opacity(.5);
    transition:filter .2s, transform .1s;
  }
  .mode-btn img{ display:block; height:52px; width:auto; }
  .mode-btn.active{ filter:none; }
  .mode-btn:active{ transform:translateY(1px); }

  .top-actions{ display:flex; align-items:center; gap:14px; }
  .icon-circle{
    border:none; cursor:pointer; padding:0;
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s, filter .15s;
  }
  .icon-circle:hover{ transform:scale(1.07); }
  .icon-circle:active{ transform:scale(.92); }

  .sound-btn{ position:relative; background:transparent; }
  .sound-btn img{ width:100%; height:100%; display:block; }
  .mute-slash{
    position:absolute; left:50%; top:50%;
    width:2px; height:26px; background:#d1467a;
    transform:translate(-50%,-50%) rotate(45deg);
    border-radius:2px; opacity:0; transition:opacity .15s;
  }
  .sound-btn.muted .mute-slash{ opacity:1; }

  .fullscreen-btn{ background:transparent; }
  .fullscreen-btn img{ width:100%; height:100%; display:block; }

  .reset-btn{
    background:#fff;
    box-shadow:0 6px 16px rgba(91,63,224,0.18);
  }
  .reset-btn svg{ width:22px; height:22px; }
  .reset-btn:active svg{ transform:rotate(-70deg); }
  .reset-btn svg{ transition:transform .3s ease; stroke:var(--accent-deep); }

  /* ---------------- stage ---------------- */
  .stage{
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }

  .time-display{
    font-family:'Poppins',sans-serif; font-weight:800;
    font-size:clamp(56px,9vw,104px); letter-spacing:1px;
    color:var(--ink);
    cursor:text;
    user-select:none;
  }
  .time-edit{
    text-align:center; background:transparent; border:none; outline:none;
    font-family:'Poppins',sans-serif; font-weight:800; color:var(--ink);
    font-size:clamp(44px,7vw,72px); letter-spacing:1px;
    width:60%;
  }
  .face-mood{
    margin-top:-14px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:2px; text-transform:uppercase; color:var(--pink);
    min-height:16px; text-align:center;
  }

  .divider{ width:100%; max-width:480px; height:auto; display:block; }

  .add-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .tag-btn{
    border:none; background:transparent; cursor:pointer; padding:0;
    transition:transform .1s, filter .15s;
  }
  .tag-btn img{ display:block; height:58px; width:auto; }
  .tag-btn:hover{ filter:brightness(1.05); }
  .tag-btn:active{ transform:translateY(2px); }

  .stopwatch-mode .add-row{ visibility:hidden; }

  .main-bar{
    position:relative; width:100%; max-width:680px; border:none; background:transparent;
    padding:0; cursor:pointer; transition:filter .15s, transform .1s;
  }
  .main-bar img{ width:100%; display:block; }
  .main-bar:hover{ filter:brightness(1.05); }
  .main-bar:active{ transform:translateY(2px); }

  .pause-patch{
    display:none;
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:11%; aspect-ratio:1/1; border-radius:50%;
    background:var(--btn-mid);
    align-items:center; justify-content:center;
  }
  .running .pause-patch{ display:flex; }
  .pause-patch svg{ width:46%; height:46%; }

  /* ---------------- side decorations ---------------- */
  .deco{ position:absolute; bottom:26px; z-index:2; pointer-events:none; }
  .deco-left{ left:-34px; width:280px; }
  .deco-right{ right:-40px; width:290px; }
  .deco img{ width:100%; height:auto; display:block; }

  @media (max-width: 860px){
    .deco{ display:none; }
    .scene{ padding:0 4px 10px; max-width:640px; }
  }
  @media (max-width: 520px){
    .mode-btn img{ height:42px; }
    .icon-circle{ width:44px; height:44px; }
    .card{ padding:24px 20px 30px; }
    .topbar-left{ gap:12px; }
    .logo-link img{ height:26px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="card" id="card">

    <div class="sparkles" id="sparkles"></div>

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-left">
        <a class="logo-link" href="/" target="_top" title="Go to home page">
          <img src="assets/logo_reference.png" alt="Questlix home">
        </a>
        <div class="mode-toggle">
          <button class="mode-btn active" id="timerTab">
            <img src="assets/timer_selected.png" alt="Timer">
          </button>
          <button class="mode-btn" id="stopwatchTab">
            <img src="assets/stopwatch_white.png" alt="Stopwatch">
          </button>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-circle sound-btn" id="soundBtn" title="Toggle sound">
          <img src="assets/sound_button.png" alt="Sound">
          <span class="mute-slash"></span>
        </button>
        <button class="icon-circle reset-btn" id="resetBtn" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20 3 20 8 15 8"/></svg>
        </button>
        <button class="icon-circle fullscreen-btn" id="maximizeBtn" title="Maximize">
          <img src="assets/fullscreen_button.png" alt="Fullscreen">
        </button>
      </div>
    </div>

    <!-- STAGE -->
    <div class="stage">
      <div class="time-display" id="timeDisplay">05:00</div>
      <div class="face-mood" id="faceMood"></div>

      <img class="divider" src="assets/star_divider.png" alt="">

      <div class="add-row" id="addRow">
        <button class="tag-btn" data-secs="30"><img src="assets/add_30_seconds.png" alt="+0:30"></button>
        <button class="tag-btn" data-secs="60"><img src="assets/add_1_minute.png" alt="+1:00"></button>
        <button class="tag-btn" data-secs="300"><img src="assets/add_5_minutes.png" alt="+5:00"></button>
      </div>

      <button class="main-bar" id="startBtn" title="Start / Pause">
        <img src="assets/play_button.png" alt="">
        <div class="pause-patch" id="pausePatch">
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="#fff"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="#fff"/></svg>
        </div>
      </button>
    </div>

  </div>

  <!-- LEFT DECORATION: hourglass + clouds -->
  <div class="deco deco-left"><img src="assets/left_clouds.png" alt=""></div>

  <!-- RIGHT DECORATION: stopwatch + clouds -->
  <div class="deco deco-right"><img src="assets/right_clouds.png" alt=""></div>

</div>

<script>
  const timeDisplay = document.getElementById('timeDisplay');
  const card        = document.getElementById('card');
  const faceMood    = document.getElementById('faceMood');
  const startBtn    = document.getElementById('startBtn');
  const resetBtn    = document.getElementById('resetBtn');
  const maximizeBtn = document.getElementById('maximizeBtn');
  const soundBtn    = document.getElementById('soundBtn');
  const timerTab    = document.getElementById('timerTab');
  const stopwatchTab= document.getElementById('stopwatchTab');

  // ---- scattered sparkle background (no full-canvas asset was provided) ----
  (function drawSparkles(){
    const wrap = document.getElementById('sparkles');
    const SPARKLE = (x,y,s,color)=>`<path transform="translate(${x} ${y})" d="M${s} 0 L${s*1.3} ${s*0.7} L${s*2.2} ${s} L${s*1.3} ${s*1.3} L${s} ${s*2.2} L${s*0.7} ${s*1.3} L0 ${s} L${s*0.7} ${s*0.7} Z" fill="${color}"/>`;
    const STAR = (x,y,r,color,filled)=>{
      let d='', cx=r, cy=r;
      for(let i=0;i<10;i++){
        const ang = Math.PI/5*i - Math.PI/2;
        const rad = i%2===0 ? r : r*0.42;
        const px = cx + rad*Math.cos(ang), py = cy + rad*Math.sin(ang);
        d += (i===0?'M':'L') + px.toFixed(1) + ' ' + py.toFixed(1) + ' ';
      }
      d += 'Z';
      return `<svg style="position:absolute;left:${x}%;top:${y}%;width:${r*2}px;height:${r*2}px;" viewBox="0 0 ${r*2} ${r*2}"><path d="${d}" fill="${filled?color:'none'}" stroke="${color}" stroke-width="2"/></svg>`;
    };
    const DOT = (x,y,r,color,filled)=>`<svg style="position:absolute;left:${x}%;top:${y}%;width:${r*2}px;height:${r*2}px;" viewBox="0 0 ${r*2} ${r*2}"><circle cx="${r}" cy="${r}" r="${r-1.5}" fill="${filled?color:'none'}" stroke="${color}" stroke-width="2"/></svg>`;
    const DIAMOND = (x,y,r,color)=>`<svg style="position:absolute;left:${x}%;top:${y}%;width:${r*2}px;height:${r*2}px;" viewBox="0 0 ${r*2} ${r*2}"><rect x="${r*0.3}" y="${r*0.3}" width="${r*1.4}" height="${r*1.4}" fill="none" stroke="${color}" stroke-width="2" transform="rotate(45 ${r} ${r})"/></svg>`;
    const SPARK = (x,y,r,color)=>`<svg style="position:absolute;left:${x}%;top:${y}%;width:${r*2}px;height:${r*2}px;" viewBox="0 0 ${r*2} ${r*2}"><path d="M${r} 0 C${r*1.1} ${r*0.85} ${r*1.15} ${r*0.9} ${r*2} ${r} C${r*1.15} ${r*1.1} ${r*1.1} ${r*1.15} ${r} ${r*2} C${r*0.9} ${r*1.15} ${r*0.85} ${r*1.1} 0 ${r} C${r*0.85} ${r*0.9} ${r*0.9} ${r*0.85} ${r} 0 Z" fill="${color}"/></svg>`;

    const items = [
      SPARK(6,20,9,'#8b6ae0'),
      SPARK(25,26,7,'#e88fb0'),
      STAR(13,32,15,'#8fb4ea',false),
      DOT(9,45,5,'#e88fb0',true),
      DIAMOND(21,55,8,'#8b6ae0'),

      SPARK(74,17,10,'#8b6ae0'),
      STAR(81,22,17,'#8b6ae0',false),
      DOT(94,32,5,'#6fa8e0',true),
      STAR(79,36,10,'#f0b84a',true),
      DOT(89,45,5,'#e88fb0',true),
      DIAMOND(92,54,7,'#6fa8e0'),
      SPARK(90,60,6,'#8b6ae0'),
    ];
    wrap.innerHTML = items.join('');
  })();

  let mode = 'timer';        // 'timer' | 'stopwatch'
  let totalSeconds = 300;
  let remaining = 300;
  let elapsed = 0;
  let running = false;
  let intervalId = null;
  let soundOn = true;
  let audioCtx = null;

  function format(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function render(){
    timeDisplay.textContent = mode === 'timer' ? format(remaining) : format(elapsed);
  }

  function clearDone(){
    faceMood.textContent = '';
  }

  function tick(){
    if(mode === 'timer'){
      remaining--;
      if(remaining <= 0){ remaining = 0; render(); finish(); return; }
      render();
    } else {
      elapsed++;
      render();
    }
  }

  function start(){
    if(running) return;
    if(mode === 'timer' && remaining <= 0) return;
    running = true;
    card.classList.add('running');
    intervalId = setInterval(tick, 1000);
  }

  function pause(){
    running = false;
    card.classList.remove('running');
    clearInterval(intervalId);
  }

  function reset(){
    pause();
    if(mode === 'timer'){ remaining = totalSeconds; clearDone(); }
    else { elapsed = 0; }
    render();
  }

  function addTime(sec){
    if(mode !== 'timer') return;
    clearDone();
    if(remaining <= 0 && !running){ totalSeconds = sec; remaining = sec; }
    else { totalSeconds += sec; remaining += sec; }
    render();
  }

  function finish(){
    pause();
    faceMood.textContent = "Time's up!";
    chime();
  }

  // ---- mode switching ----
  function setMode(m){
    if(mode === m) return;
    pause();
    mode = m;
    clearDone();
    const isTimer = m === 'timer';
    timerTab.classList.toggle('active', isTimer);
    stopwatchTab.classList.toggle('active', !isTimer);
    card.classList.toggle('stopwatch-mode', !isTimer);
    if(isTimer){ remaining = totalSeconds; } else { elapsed = 0; }
    render();
  }
  timerTab.addEventListener('click', ()=> setMode('timer'));
  stopwatchTab.addEventListener('click', ()=> setMode('stopwatch'));

  // ---- buttons ----
  startBtn.addEventListener('click', ()=>{
    if(mode === 'timer' && remaining <= 0){ reset(); }
    running ? pause() : start();
  });
  resetBtn.addEventListener('click', reset);

  document.querySelectorAll('.tag-btn[data-secs]').forEach(btn=>{
    btn.addEventListener('click', ()=> addTime(parseInt(btn.dataset.secs,10)));
  });

  // ---- click time to edit (timer mode only) ----
  timeDisplay.addEventListener('click', ()=>{
    if(mode !== 'timer' || running) return;
    const parent = timeDisplay.parentElement;
    const input = document.createElement('input');
    input.className = 'time-edit';
    input.value = format(remaining);
    input.maxLength = 5;
    timeDisplay.replaceWith(input);
    input.focus();
    input.select();
    function commit(){
      const m = input.value.match(/^(\d{1,3}):?(\d{0,2})$/);
      let secs = totalSeconds;
      if(m){
        const mm = parseInt(m[1]||'0',10);
        const ss = parseInt(m[2]||'0',10);
        secs = Math.max(0, mm*60 + Math.min(ss,59));
      }
      totalSeconds = secs;
      remaining = secs;
      clearDone();
      timeDisplay.textContent = format(remaining);
      input.replaceWith(timeDisplay);
    }
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ input.blur(); } });
    input.addEventListener('blur', commit, { once:true });
  });

  // ---- sound ----
  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.classList.toggle('muted', !soundOn);
  });
  function chime(){
    if(!soundOn) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523, 659, 784, 1047];
      notes.forEach((f,i)=>{
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine'; o.frequency.value = f;
        const t = audioCtx.currentTime + i*0.14;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
        o.start(t); o.stop(t+0.4);
      });
    }catch(e){}
  }

  // ---- maximize / focus ----
  let focusMode = false;
  maximizeBtn.addEventListener('click', ()=>{
    const goingFull = !focusMode;
    if(goingFull){
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(req) req.call(el).catch(()=>{});
    } else if(document.fullscreenElement || document.webkitFullscreenElement){
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if(exit) exit.call(document).catch(()=>{});
    }
    focusMode = goingFull;
  });
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement) focusMode = false;
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    if(!document.webkitFullscreenElement) focusMode = false;
  });

  render();
</script>
</body>
</html>
